# cargo-deny licence allowlist. CI runs `cargo deny check licenses`.
# A dependency under any other licence fails the check; review it (and the
# notices in THIRD_PARTY_NOTICES.md) before adding it here.

[graph]
# The platforms Hablo ships for.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# MPL-2.0 is allowed only for these crates, used unmodified (see the MPL section
# of THIRD_PARTY_NOTICES.md). A new MPL dependency fails the check until it is
# reviewed and listed here.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "nucleo-matcher", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
]
